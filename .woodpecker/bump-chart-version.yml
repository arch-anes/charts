---
clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false

steps:
  - name: Create GitHub App token
    image: ghcr.io/yyewolf/woodpecker-plugins/github-app-token:1.2.4
    settings:
      github_app_id:
        from_secret: archanes_github_app_id
      github_installation_id:
        from_secret: archanes_github_app_installation_id
      github_private_key_pem:
        from_secret: archanes_github_app_private_key
      output_file: .github_token

  - name: Bump chart version
    image: mcr.microsoft.com/devcontainers/base:ubuntu26.04@sha256:b1e3b08610ae0b2599f57c3a492eebc93d1d26dbaefb4a0bad0caa7149e4ec95
    commands:
      - |
        token=$(cat .github_token)
        rm -f .github_token
        if [ -z "$token" ]; then
          echo "github app token is missing" >&2
          exit 1
        fi
        git fetch origin "${CI_COMMIT_TARGET_BRANCH}"
        changed=false
        for chart in $(git diff --name-only "origin/${CI_COMMIT_TARGET_BRANCH}...HEAD" | grep '^charts/[^/]*/' | cut -d/ -f2 | sort -u); do
          chart_file="charts/$chart/Chart.yaml"
          [ -f "$chart_file" ] || continue
          old_version=$(git show "origin/${CI_COMMIT_TARGET_BRANCH}:$chart_file" | grep '^version:' | awk '{print $2}')
          cur_version=$(grep '^version:' "$chart_file" | awk '{print $2}')
          if [ "$old_version" = "$cur_version" ]; then
            major=$(echo "$cur_version" | cut -d. -f1)
            minor=$(echo "$cur_version" | cut -d. -f2)
            patch=$(echo "$cur_version" | cut -d. -f3)
            bumped="$major.$minor.$((patch + 1))"
            sed -i "s/^version: .*/version: $bumped/" "$chart_file"
            echo "Bumped $chart: $cur_version -> $bumped"
            changed=true
          fi
        done
        if [ "$changed" = "true" ]; then
          git config user.name "woodpecker-bot"
          git config user.email "woodpecker-bot@users.noreply.woodpecker-ci.org"
          push_url=$(echo "${CI_REPO_CLONE_URL}" | sed "s#://#://x-access-token:$token@#")
          git remote set-url origin "$push_url"
          git add charts/
          git commit -m "chore: bump chart version"
          git push origin "HEAD:${CI_COMMIT_SOURCE_BRANCH}"
        fi

when:
  - event: pull_request
    branch: main
