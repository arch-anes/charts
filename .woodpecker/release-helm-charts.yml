---
clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b8d2401997be68ec25d62bd753fe5d30236e029fe007a5e823177e0e485ae205
    settings:
      partial: false

steps:
  - name: Create GitHub App token
    image: ghcr.io/yyewolf/woodpecker-plugins/github-app-token:1.2.4
    settings:
      github_app_id:
        from_secret: archanes_github_app_id
      github_installation_id:
        from_secret: archanes_github_app_installation_id
      github_private_key_pem:
        from_secret: archanes_github_app_private_key
      output_file: .github_token

  - name: Configure git
    image: ghcr.io/arch-anes/dev-container-kubernetes:latest@sha256:27202383475d255789bb357858809e8c91572c34d7e36c361af1ef1c5841c115
    commands:
      - sudo chown -R "$(id -u):$(id -g)" .
      - |
        token=$(cat .github_token)
        rm -f .github_token
        if [ -z "$token" ]; then
          echo "github app token is missing" >&2
          exit 1
        fi
        git config user.name "Woodpecker CI"
        git config user.email "woodpecker@users.noreply.woodpecker-ci.org"
        push_url=$(echo "${CI_REPO_CLONE_URL}" | sed "s#://#://x-access-token:$token@#")
        git remote set-url origin "$push_url"
      - for chart in charts/*/; do helm dependency build "$chart"; done
      - mkdir -p ./artifacts
      - for chart in charts/*/; do helm package "$chart" -d ./artifacts; done
      - git fetch origin gh-pages || true
      - git checkout gh-pages || git checkout --orphan gh-pages
      - mv ./artifacts/* ./
      - helm repo index . --merge index.yaml --url https://arch-anes.github.io/charts
      - git add .
      - git commit -m "Update Helm charts"
      - git push origin gh-pages

when:
  - event: push
    branch: main
