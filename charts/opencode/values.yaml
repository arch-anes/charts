# Image definitions
image:
  repository: ghcr.io/arch-anes/opencode
  tag: "{{ .Chart.AppVersion }}"
  pullPolicy: IfNotPresent

service:
  main:
    ports:
      main:
        port: 4096
        targetPort: 4096

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            readiness:
              enabled: true
              type: tcp
              port: 4096
            liveness:
              enabled: true
              type: tcp
              port: 4096
            startup:
              enabled: true
              type: tcp
              port: 4096
          env:
            OPENCODE_SERVER_USERNAME: opencode
            OPENCODE_SERVER_PASSWORD: ""
          args:
            - serve
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"

securityContext:
  container:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    # Blocks setuid helpers (sudo, newuidmap, mount, ...) from gaining
    # privileges. opencode itself does not need any of them.
    allowPrivilegeEscalation: false

podOptions:
  # Run the pod in its own user namespace so that any privilege it does have
  # is scoped to the pod instead of the host user namespace.
  hostUsers: false

persistence:
  home:
    enabled: true
    mountPath: /home/vscode
    targetSelector:
      main:
        main: {}
